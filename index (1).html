<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
  /* ==========================================================================
     AMALFI S.A. E.S.P. — Design System (tokens oficiales)
     Amarillo #F0E02A · Gris #707070 · Teal #4FB6B6 · Lima #A9D06B · Ink #1D1D1B
     Tipografía: Fredoka (display) + Nunito (texto) + JetBrains Mono.
     ========================================================================== */
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --amalfi-yellow: #F0E02A;
    --amalfi-yellow-bright: #FCEF4C;
    --amalfi-yellow-deep: #D8C700;
    --amalfi-yellow-soft: #FBF7C4;
    --amalfi-gray: #707070;
    --amalfi-gray-dark: #4D4D4D;
    --amalfi-gray-darker: #333333;
    --amalfi-teal: #4FB6B6;
    --amalfi-teal-dark: #2F8F8F;
    --amalfi-teal-soft: #DBF0F0;
    --amalfi-lime: #A9D06B;
    --amalfi-lime-dark: #7FA843;
    --amalfi-lime-soft: #E9F3D6;
    --amalfi-ink: #1D1D1B;

    --neutral-0:#FFFFFF; --neutral-25:#FAFAFA; --neutral-50:#F4F4F4; --neutral-100:#ECECEC;
    --neutral-200:#DCDCDC; --neutral-300:#C0C0C0; --neutral-400:#9A9A9A; --neutral-500:#707070;
    --neutral-600:#585858; --neutral-700:#404040; --neutral-800:#2A2A2A; --neutral-900:#1D1D1B;

    --success:#6FAF3C; --success-soft:#E9F3D6; --warning:#E9B21E; --warning-soft:#FBEFC9;
    --danger:#D64545; --danger-soft:#F7DEDE; --info:#4FB6B6; --info-soft:#DBF0F0;

    --text-heading: var(--amalfi-gray-dark);
    --text-body: var(--neutral-700);
    --text-muted: var(--neutral-500);
    --text-subtle: var(--neutral-400);
    --surface-page: var(--neutral-25);
    --surface-card: var(--neutral-0);
    --surface-sunken: var(--neutral-50);
    --border-subtle: var(--neutral-200);
    --border-default: var(--neutral-300);

    --font-display: 'Fredoka', 'Trebuchet MS', sans-serif;
    --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-xl:26px; --radius-pill:999px;
    --shadow-xs:0 1px 2px rgba(29,29,27,0.06);
    --shadow-sm:0 2px 6px rgba(29,29,27,0.08);
    --shadow-md:0 6px 18px rgba(29,29,27,0.10);
    --shadow-lg:0 14px 36px rgba(29,29,27,0.14);
    --shadow-brand:0 8px 22px rgba(216,199,0,0.35);
    --shadow-focus:0 0 0 3px rgba(79,182,182,0.45);
    --dur-base:200ms; --ease:cubic-bezier(0.4,0,0.2,1);

    --sidebar-w: 244px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-body); color: var(--text-body); background: var(--surface-page); }
  a { color: var(--amalfi-teal-dark); }
  a:hover { color: var(--amalfi-teal); }

  /* ---------- Shell ---------- */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--surface-card);
    border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column;
    padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; }
  .brand img { height: 40px; width: auto; }
  .brand-txt { line-height: 1.1; }
  .brand-txt b { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--text-heading); display: block; }
  .brand-txt span { font-size: 11px; color: var(--text-muted); }

  .nav-cat { margin-top: 14px; }
  .nav-cat-title {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.10em;
    color: var(--text-subtle); padding: 6px 10px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--radius-md);
    font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer; border: none;
    background: transparent; width: 100%; text-align: left; transition: background var(--dur-base), color var(--dur-base);
    font-family: var(--font-body);
  }
  .nav-item:hover { background: var(--surface-sunken); color: var(--text-heading); }
  .nav-item.active { background: var(--amalfi-yellow); color: var(--amalfi-gray-darker); }
  .nav-item .lucide { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sidebar-help {
    margin-top: auto; background: var(--amalfi-teal-soft); border-radius: var(--radius-md);
    padding: 14px; text-align: center; margin-top: 20px;
  }
  .sidebar-help b { font-size: 13px; color: var(--amalfi-teal-dark); display: block; }
  .sidebar-help span { font-size: 12px; color: var(--text-muted); }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 68px; flex-shrink: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center;
    justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 20;
  }
  .topbar-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--text-heading); }
  .topbar-sub { font-size: 12.5px; color: var(--text-muted); }
  .user-chip { display: flex; align-items: center; gap: 12px; }
  .role-badge {
    font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: var(--radius-pill);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .role-badge.ADMIN { background: var(--amalfi-yellow); color: var(--amalfi-gray-darker); }
  .role-badge.VIEWER { background: var(--amalfi-teal-soft); color: var(--amalfi-teal-dark); }
  .user-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--amalfi-yellow);
    color: var(--amalfi-gray-darker); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; font-family: var(--font-display);
  }
  .content { flex: 1; padding: 28px; max-width: 1200px; width: 100%; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); padding: 22px; margin-bottom: 22px;
  }
  .card.accent { border-top: 4px solid var(--amalfi-yellow); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .card-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--text-heading); margin: 0; display: flex; align-items: center; gap: 9px; }
  .card-title .lucide { width: 20px; height: 20px; color: var(--amalfi-teal-dark); }

  /* ---------- Filtros ---------- */
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field select, .field input {
    width: 100%; padding: 9px 11px; border: 2px solid var(--border-subtle); border-radius: var(--radius-md);
    font-size: 13.5px; font-family: inherit; background: #fff; color: var(--text-body);
  }
  .field select:focus, .field input:focus { outline: none; border-color: var(--amalfi-teal); box-shadow: var(--shadow-focus); }

  /* ---------- Botones ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: var(--radius-md);
    font-size: 13.5px; font-weight: 700; border: none; cursor: pointer; font-family: var(--font-body);
    transition: filter var(--dur-base), transform 80ms, background var(--dur-base);
  }
  .btn .lucide { width: 17px; height: 17px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--amalfi-yellow); color: var(--amalfi-gray-darker); box-shadow: var(--shadow-brand); }
  .btn-primary:hover { background: var(--amalfi-yellow-bright); }
  .btn-secondary { background: var(--amalfi-gray); color: #fff; }
  .btn-secondary:hover { background: var(--amalfi-gray-dark); }
  .btn-outline { background: transparent; color: var(--text-heading); border: 2px solid var(--border-default); }
  .btn-outline:hover { background: var(--surface-sunken); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* ---------- Tabla ---------- */
  .table-wrap { overflow: auto; max-height: 62vh; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
  table.data-table { border-collapse: collapse; width: 100%; font-size: 12.8px; }
  table.data-table thead th {
    position: sticky; top: 0; background: var(--amalfi-gray-dark); color: #fff; text-align: left;
    padding: 11px 13px; white-space: nowrap; font-weight: 700; font-size: 12px;
  }
  table.data-table tbody td { padding: 9px 13px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
  table.data-table tbody tr:nth-child(even) { background: var(--surface-sunken); }
  table.data-table tbody tr:hover { background: var(--amalfi-yellow-soft); }
  .row-count { font-size: 12px; color: var(--text-muted); margin-top: 10px; font-family: var(--font-mono); }

  /* ---------- Calendario (Turnos) ---------- */
  .cal-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav .btn { padding: 8px; }
  .month-label { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--text-heading); min-width: 160px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 6px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-subtle); padding: 6px 0; }
  .cal-cell { min-height: 96px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 6px; background: #fff; }
  .cal-cell.empty { background: var(--surface-sunken); border-style: dashed; }
  .cal-cell.today { border-color: var(--amalfi-teal); box-shadow: var(--shadow-focus); }
  .cal-day { font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; }
  .cal-chip {
    font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: var(--radius-sm); margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 1.4;
  }
  .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--text-muted); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  /* ---------- Cronograma (Gantt mensual) ---------- */
  .gantt { margin-top: 8px; overflow-x: auto; }
  .gantt-head, .gantt-row { display: grid; grid-template-columns: 240px 1fr; align-items: stretch; }
  .gantt-days { display: grid; }
  .gantt-daycell { text-align: center; font-size: 10px; color: var(--text-subtle); border-left: 1px solid var(--neutral-100); padding: 4px 0; }
  .gantt-daycell.wknd { background: var(--surface-sunken); }
  .gantt-row { border-top: 1px solid var(--border-subtle); }
  .gantt-label { padding: 10px 10px; font-size: 12.5px; }
  .gantt-label b { color: var(--text-heading); display: block; font-weight: 700; }
  .gantt-label small { color: var(--text-muted); }
  .gantt-track { position: relative; display: grid; }
  .gantt-bar {
    grid-row: 1; height: 22px; align-self: center; border-radius: var(--radius-pill);
    background: var(--amalfi-teal); color: #fff; font-size: 10.5px; font-weight: 700;
    display: flex; align-items: center; padding: 0 8px; overflow: hidden; white-space: nowrap;
  }
  .gantt-area-0 { background: var(--amalfi-teal); }
  .gantt-area-1 { background: var(--amalfi-lime-dark); }
  .gantt-area-2 { background: var(--amalfi-yellow-deep); color: var(--amalfi-gray-darker); }
  .gantt-area-3 { background: var(--amalfi-gray); }

  /* ---------- ICA: registro fotográfico ---------- */
  .foto-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .foto-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; background: #fff; break-inside: avoid; }
  .foto-num { background: var(--amalfi-gray-dark); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; }
  .foto-img { width: 100%; height: 180px; object-fit: cover; background: var(--surface-sunken); display: block; }
  .foto-meta { padding: 9px 11px; font-size: 11.5px; }
  .foto-meta div { margin-bottom: 3px; }
  .foto-meta b { color: var(--text-heading); }

  .ica-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .ica-hero { display: flex; gap: 14px; align-items: flex-start; }
  .ica-hero .lucide { width: 40px; height: 40px; color: var(--amalfi-teal-dark); flex-shrink: 0; }

  /* ---------- Estados ---------- */
  .empty-state, .loading-state { text-align: center; padding: 44px 20px; color: var(--text-muted); font-size: 14px; }
  .loading-state .spinner {
    width: 26px; height: 26px; border: 3px solid var(--border-subtle); border-top-color: var(--amalfi-teal);
    border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--amalfi-gray-dark); color: #fff;
    padding: 13px 18px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); font-size: 13px;
    max-width: 380px; z-index: 999; border-left: 4px solid var(--amalfi-yellow);
  }
  .toast.error { border-left-color: var(--danger); }
  .toast.success { border-left-color: var(--success); }
  .toast a { color: var(--amalfi-yellow); font-weight: 700; }

  .banner {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-md);
    font-size: 13px; margin-bottom: 20px; background: var(--info-soft); color: var(--amalfi-teal-dark);
  }
  .banner .lucide { width: 20px; height: 20px; flex-shrink: 0; }
  .banner.warn { background: var(--warning-soft); color: #8a6d1a; }

  /* ---------- Acceso denegado ---------- */
  .denied-screen {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: linear-gradient(165deg, var(--amalfi-yellow-soft), var(--amalfi-teal-soft)); padding: 24px;
  }
  .denied-box { max-width: 440px; text-align: center; background: #fff; padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); }
  .denied-box img { height: 46px; margin-bottom: 18px; }
  .denied-box h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 8px; color: var(--text-heading); }
  .denied-box p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

  /* ---------- Responsivo ---------- */
  @media (max-width: 860px) {
    .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform var(--dur-base); box-shadow: var(--shadow-lg); }
    .sidebar.open { transform: translateX(0); }
    .foto-grid { grid-template-columns: repeat(2, 1fr); }
    .ica-cards { grid-template-columns: 1fr; }
    .menu-toggle { display: inline-flex !important; }
  }
  @media (max-width: 560px) { .foto-grid { grid-template-columns: 1fr; } }
  .menu-toggle { display: none; }

  /* ---------- Impresión (PDF del registro fotográfico) ---------- */
  @media print {
    .sidebar, .topbar, .no-print { display: none !important; }
    .content { padding: 0; max-width: 100%; }
    .card { box-shadow: none; border: none; margin: 0; padding: 0; }
    .foto-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .foto-img { height: 150px; }
    body { background: #fff; }
    .print-header { display: block !important; }
  }
  .print-header { display: none; text-align: center; margin-bottom: 16px; }
  .print-header img { height: 44px; }
  .print-header h2 { font-family: var(--font-display); margin: 8px 0 2px; color: var(--amalfi-gray-dark); }

  /* ---------- Clasificación de columnas en la tabla ---------- */
  .th-tipo { display: block; font-size: 9px; font-weight: 600; opacity: 0.75; text-transform: none; letter-spacing: 0; margin-top: 1px; }
  .th-tipo i { font-style: italic; }
  td.td-numero, td.td-moneda, td.td-porcentaje { text-align: right; font-family: var(--font-mono); font-size: 12px; }
  td.td-fecha { white-space: nowrap; }
  .td-numero .num, .td-moneda .num, .td-porcentaje .num { font-variant-numeric: tabular-nums; }
  .ic-mini { width: 12px; height: 12px; vertical-align: -1px; margin-right: 2px; }
  .map-btn {
    display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--amalfi-teal-dark);
    background: var(--amalfi-teal-soft); border-radius: var(--radius-pill); padding: 1px 8px; text-decoration: none; margin-left: 6px;
  }
  .map-btn:hover { background: var(--amalfi-teal); color: #fff; }
  .thumb {
    width: 54px; height: 40px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--border-subtle);
    transition: transform var(--dur-base);
  }
  .thumb:hover { transform: scale(1.06); box-shadow: var(--shadow-sm); }
  .thumb-err { opacity: 0.25; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; background: rgba(29,29,27,0.82); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .lb-inner { max-width: 92vw; max-height: 92vh; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .lb-inner img { max-width: 92vw; max-height: 80vh; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); background: #fff; }
  .lb-actions { display: flex; gap: 10px; }

  /* ---------- Campos de período ---------- */
  .pcamp { transition: opacity var(--dur-base); }
  optgroup { font-family: var(--font-body); }
</style>

</head>
<body>
  <script src="config.js"></script>
<script src="gas-shim.js"></script>

  <script>

  <script>
  // ==========================================================================
  // Estado global
  // ==========================================================================
  var SERVER = window.SERVER || { rol: 'VIEWER', puedeDescargar: false, nombreSitio: '' };
  var ROL = SERVER.rol;
  var PUEDE_DESCARGAR = !!SERVER.puedeDescargar;
  var estado = { hoja: null, titulo: '', modo: 'tabla', encabezados: [], tipos: [], filtros: {}, anio: null, mes: null };
  // Años disponibles. Se inicializa YA con años por defecto (no vacío) para que el selector de
  // período siempre permita elegir año, aunque la carga en vivo falle o tarde.
  var ANIOS = (function () { var y = new Date().getFullYear(); return [y, y - 1, y - 2]; })();

  function $(sel, ctx) { return (ctx || document).querySelector(sel); }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function iconos() { if (window.lucide) lucide.createIcons(); }

  document.addEventListener('DOMContentLoaded', function () {
    // Une los años con datos reales a los años por defecto (nunca deja la lista vacía).
    google.script.run
      .withSuccessHandler(function (a) {
        if (a && a.length) { var s = {}; ANIOS.concat(a).forEach(function (x) { s[x] = 1; }); ANIOS = Object.keys(s).map(Number).sort(); }
      })
      .withFailureHandler(function () { /* conserva los años por defecto */ })
      .apiAniosDisponibles();
    cargarMenu();
    var mt = $('#menuToggle');
    if (mt) mt.addEventListener('click', function () { $('#sidebar').classList.toggle('open'); });
    iconos();
  });

  // ==========================================================================
  // Menú lateral
  // ==========================================================================
  function cargarMenu() {
    google.script.run
      .withSuccessHandler(function (cats) {
        var nav = $('#navMenu');
        nav.innerHTML = '';

        // Grupo fijo: Descargas / ICA
        var grpFijo = el('div', { class: 'nav-cat' });
        grpFijo.appendChild(el('div', { class: 'nav-cat-title' }, 'Generar y descargar'));
        var btnDesc = el('button', { class: 'nav-item', 'data-modo': 'descargas' }, '<i data-lucide="download-cloud"></i><span>Centro de descargas</span>');
        btnDesc.onclick = function () { activar(btnDesc); abrirCentroDescargas(); };
        grpFijo.appendChild(btnDesc);
        var btnIca = el('button', { class: 'nav-item', 'data-modo': 'ica' }, '<i data-lucide="camera"></i><span>Registro fotográfico (visor)</span>');
        btnIca.onclick = function () { activar(btnIca); abrirICA(); };
        grpFijo.appendChild(btnIca);
        nav.appendChild(grpFijo);

        var primerBtn = null;
        cats.forEach(function (cat) {
          var grp = el('div', { class: 'nav-cat' });
          grp.appendChild(el('div', { class: 'nav-cat-title' }, esc(cat.categoria)));
          cat.hojas.forEach(function (h) {
            var btn = el('button', { class: 'nav-item', 'data-hoja': h.nombre },
              '<i data-lucide="' + esc(h.icono) + '"></i><span>' + esc(h.titulo) + '</span>');
            btn.onclick = function () { activar(btn); abrirHoja(h); };
            grp.appendChild(btn);
            if (!primerBtn) primerBtn = { btn: btn, hoja: h };
          });
          nav.appendChild(grp);
        });
        iconos();

        return '<a href="' + esc(cel.t) + '" target="_blank" rel="noopener"><i data-lucide="external-link" class="ic-mini"></i>Abrir</a>';

  // ==========================================================================

      '<div class="field pcamp" id="' + pref + 'SWrap" style="display:none;"><label>Semestre</label><select id="' + pref + 'S"><option value="1">S1 (Ene–Jun)</option><option value="2">S2 (Jul–Dic)</option></select></div>' +
      '<div class="field pcamp" id="' + pref + 'DiaWrap" style="display:none;"><label>Fecha</label><input type="date" id="' + pref + 'Dia"></div>' +

  // Lee el año elegido; si por alguna razón queda vacío/0, usa el año actual (evita generar vacío).
  function anioDe(pref) {

    }).join('');
    var opcEsp = m.especiales.filter(function (e) { return e.id !== 'todo'; }).map(function (e) {
      return '<option value="esp::' + esc(e.id) + '">' + esc(e.titulo) + '</option>';
    }).join('');
    var cardMod = el('div', { class: 'card accent' });
    cardMod.innerHTML =
      '<p class="card-title"><i data-lucide="sliders-horizontal"></i>Generar y descargar por módulo</p>' +
      '<p style="font-size:13px;color:var(--text-muted);margin:0 0 14px;">Elige qué documento generar y el período; se crea en tu Google Drive y aparece el enlace de descarga. Genera cada módulo por separado (ICA, registro fotográfico, compactación, pluviosidad, cronograma, turnos, o cualquier hoja) — así cada descarga es rápida y no choca con el límite de tiempo de Google.</p>' +
      '<div class="filters">' +
        '<div class="field" style="grid-column:1/-1;"><label>Módulo</label><select id="modSel">' +
          '<optgroup label="Documentos ICA">' + opcEsp + '</optgroup>' + opcHojas + '</select></div>' +
        selectorPeriodoHTML('m') +
      '</div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="bMod"><i data-lucide="download"></i>Generar</button></div>' +
      '<div id="modMsg"></div>';
    root.appendChild(cardMod);
    iconos();
    wirePeriodo('m');

    $('#bMod').onclick = function () {
      var val = $('#modSel').value, per = leerPeriodo('m');
      var opts;
      if (val.indexOf('hoja::') === 0) opts = { modulo: 'hoja', hoja: val.slice(6), periodo: per };
      else opts = { modulo: val.slice(5), periodo: per };
      confirmarYGenerar(this, opts, '<i data-lucide="download"></i>Generar', $('#modMsg'), false);
    };
  }

  function confirmarYGenerar(btn, opts, htmlOrig, cont, esTodo) {
    btn.disabled = true; btn.innerHTML = '<i data-lucide="loader"></i>Generando… (puede tardar 1–3 min)'; iconos();
    cont.innerHTML = '<div class="banner"><i data-lucide="info"></i><div>Procesando el período seleccionado. Con muchas fotos puede tardar; no cierres esta ventana.</div></div>';
    iconos();
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.innerHTML = htmlOrig;
        var html = '';
        if (res.carpeta) {
          html = '<div class="banner" style="background:var(--success-soft);color:#2e6b1e;"><i data-lucide="check-circle"></i><div><b>Paquete generado</b> (' + esc(res.periodo) + ').' +
            (res.nota ? '<br><span style="color:#8a6d1a;">' + esc(res.nota) + '</span>' : '') +
            '<br><a class="btn btn-primary" style="margin-top:8px;" href="' + res.url + '" target="_blank"><i data-lucide="folder-open"></i>Abrir carpeta en Drive</a></div></div>';
        } else {
          html = '<div class="banner" style="background:var(--success-soft);color:#2e6b1e;"><i data-lucide="check-circle"></i><div><b>Listo</b> (' + esc(res.periodo) + ')' + (res.nota ? ' · ' + esc(res.nota) : '') + '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">' +
            (res.archivos || []).map(function (a) { return '<a class="btn btn-outline" href="' + (a.descarga || a.url) + '" target="_blank"><i data-lucide="file-down"></i>' + esc(a.nombre) + '</a>'; }).join('') + '</div></div></div>';
        }
        cont.innerHTML = html; iconos();
        mostrarToast('Generación completada.', 'success');
      })
      .withFailureHandler(function (e) { btn.disabled = false; btn.innerHTML = htmlOrig; iconos(); cont.innerHTML = '<div class="banner warn"><i data-lucide="alert-triangle"></i><div>' + esc(e.message) + '</div></div>'; iconos(); })
      .apiGenerar(opts);
  }

  // helper para botones de un solo módulo con período fijo (turnos/cronograma mes)
  function botonGenerar(btn, opts, htmlOrig) {
    btn.disabled = true; btn.innerHTML = '<i data-lucide="loader"></i>Generando…'; iconos();
    google.script.run
      .withSuccessHandler(function (res) { btn.disabled = false; btn.innerHTML = htmlOrig; iconos();
        var a = (res.archivos && res.archivos[0]) || {}; mostrarToast('Generado: <a href="' + (a.descarga || a.url) + '" target="_blank">' + esc(a.nombre || 'archivo') + '</a>', 'success'); })
      .withFailureHandler(function (e) { btn.disabled = false; btn.innerHTML = htmlOrig; iconos(); mostrarError(e); })
      .apiGenerar(opts);
  }

  // ==========================================================================
  // VISTA: Registro fotográfico (solo visualizador)
  // La generación/descarga de documentos ICA vive en el Centro de descargas.
  // ==========================================================================
  function abrirICA() {
    estado.modo = 'ica';
    setTitulo('Registro fotográfico', 'Visualiza las evidencias fotográficas del período');
    var root = $('#viewRoot'); root.innerHTML = '';

    var cardPrev = el('div', { class: 'card' });
    cardPrev.innerHTML =
      '<p class="card-title"><i data-lucide="image"></i>Registro fotográfico</p>' +
      '<div class="filters">' + selectorPeriodoHTML('i') +
        '<div class="field"><label>Origen de fotos</label><select id="icaHoja"><option value="(todas)">Todas las hojas con fotos</option></select></div>' +
      '</div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="icaCargar"><i data-lucide="images"></i>Cargar fotos del período</button>' +
        '<span style="font-size:12px;color:var(--text-muted);align-self:center;">Para descargar el informe o el registro en Excel/PDF, usa el <b>Centro de descargas</b>.</span></div>' +
      '<div id="icaFotos" style="margin-top:14px;"><div class="empty-state">Elige un período y presiona <b>Cargar fotos del período</b>.</div></div>';
    root.appendChild(cardPrev);
    iconos(); wirePeriodo('i');

    google.script.run.withSuccessHandler(function (r) {
      var sel = $('#icaHoja'); (r.hojasConFotos || []).forEach(function (h) { sel.innerHTML += '<option value="' + esc(h) + '">' + esc(h) + '</option>'; });
    }).apiRegistroFotografico({});

    $('#icaCargar').onclick = cargarFotosICA;
  }

  function cargarFotosICA() {
    var cont = $('#icaFotos'); cont.innerHTML = '<div class="loading-state"><div class="spinner"></div>Cargando fotos…</div>';
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r.fotos.length) { cont.innerHTML = '<div class="empty-state">No se encontraron fotos para el filtro seleccionado.</div>'; return; }
        cont.innerHTML = '<div class="foto-grid">' + r.fotos.map(function (f, i) {
          return '<div class="foto-card"><div class="foto-num">N° ' + (i + 1) + ' · ' + esc(f.hoja) + '</div>' +
            '<img class="foto-img" loading="lazy" src="' + esc(f.url) + '" onclick="abrirLightbox(\'' + esc(f.url).replace(/\'/g, "\\'") + '\')" onerror="this.style.opacity=0.3;">' +
            '<div class="foto-meta"><div><b>Fecha:</b> ' + esc(f.fecha || '—') + '</div><div><b>Lugar:</b> ' + esc(f.lugar || '—') + '</div><div><b>Obs.:</b> ' + esc(f.observaciones || '—') + '</div></div></div>';
        }).join('') + '</div>';
        mostrarToast(r.fotos.length + ' foto(s) encontradas.', 'success');
      })
      .withFailureHandler(mostrarError)
      .apiRegistroFotografico({ hoja: $('#icaHoja').value, fechaInicio: fechaIniDe(leerPeriodo('i')), fechaFin: fechaFinDe(leerPeriodo('i')) });
  }
  // Convierte un período a fechaInicio/fin ISO para apiRegistroFotografico (previsualización)
  function fechaIniDe(p) { if (p.tipo === 'dia') return p.fecha; if (p.tipo === 'rango') return p.desde; return null; }
  function fechaFinDe(p) { if (p.tipo === 'dia') return p.fecha; if (p.tipo === 'rango') return p.hasta; return null; }

  // ==========================================================================
  // Utilidades
  // ==========================================================================
  function mostrarToast(html, tipo) {
    var d = el('div', { class: 'toast ' + (tipo || '') }, html);
    $('#toastContainer').appendChild(d); setTimeout(function () { d.remove(); }, 9000);
  }
  function mostrarError(err) { mostrarToast(err && err.message ? esc(err.message) : esc(String(err)), 'error'); }
</script>

</body>
</html>
